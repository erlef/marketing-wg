---
layout: default
---

<header class="py-5 bg-brand" role="banner">
  <div class="container">
    <div class="split-container">
      <div class="split-left">
        <a href="{{page.logo_url}}"><img src="{{ page.logo }}" width="200px"></a>
      </div>
      <div class="split-right">
        <h1 class="mb-0 text-white font-weight-black display-4 text-balance mt-4">{{ page.title }}</h1>
      </div>
    </div>
    
    {% if page.description %}
    <h2 class="mb-0 h3 font-weight-normal text-white text-balance">
      {{ page.description }}
    </h2>
    {% endif %}
  </div>
</header>
<main role="main">
  <section class="p-3 mb-5 bg-white">
    <div class="container">
      <div class="split-container">
        <div class="split-left">
          <a href="{{page.sup_logo_url}}"><img src="{{ page.sup_logo }}" width="200px"></a>
        </div>
        <div class="split-right">
          <p class="mb-0 text-black font-weight-bold text-balance mt-4">{{ content }}</p>
        </div>
      </div>
      {% include page-series-links.html %}
    </div>
  </section>
</main>
