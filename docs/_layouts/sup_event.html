---
layout: default
---

<header class="py-4 bg-brand" role="banner">
  <div class="container">
    <div class="split-container">
        <div class="split-left">
          <a href="{{page.logo_url}}">
            <img src="{{ page.logo }}" width="150px">
          </a>
        </div>
      <div class="split-right">
        <h2 class="mb-0 text-white font-weight-black display-25 text-balance">{{ page.title }}</h2>
      </div>
    </div>
  </div>
</header>
<main role="main">
  {% if page.description %}
  <section class="p-3 bg-white text-black">
    <h4 class="mb-0 h4 font-weight-normal">
      {{ page.description }}
    </h4>
  </section> 
  {% endif %}
  
  <section class="my-5 bg-white" style="min-height: 15em">
    <div class="container">
      <div class="split-container">
        <a class="split-left" href="{{page.sup_logo_url}}">
          <img src="{{ page.sup_logo }}" width="200px">
        </a>
        <div class="split-right">
          <p class="mb-0 text-black font-weight-bold text-balance mt-4">{{ content }}</p>
        </div>
      </div>
    </div>
  </section>
  <section class="py-4 bg-white container">
    {% include page-series-links.html %}
  </section>
</main>
